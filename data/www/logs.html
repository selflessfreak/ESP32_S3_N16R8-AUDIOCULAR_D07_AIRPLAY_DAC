.a90{color:#6e7681}.a91{color:#ff7b72}.a92{color:#56d364}.a93{color:#e3b341}.a94{color:#79c0ff}.a95{color:#d2a8ff}.a96{color:#56d4dd}.a97{color:#f0f6fc}

input[type=text],input[type=password],input[type=number],select,textarea{padding:11px 13px!important;min-height:44px}
input:focus,textarea:focus,select:focus{outline:2px solid rgba(120,170,255,.45)!important;outline-offset:1px}
input[type=range]{accent-color:var(--sf-accent)!important}
.btn,.btn-sm,button:not(.sf-theme-btn):not(.tab){border-radius:13px!important;font-family:inherit!important;font-weight:610!important;transition:transform .15s,background .15s,border-color .15s}

.btn-primary{background:linear-gradient(135deg,#4487ef,#6564e8)!important;color:white!important;border:1px solid rgba(255,255,255,.12)!important}
.btn-secondary,.btn-sm,.btn:not(.btn-primary):not(.btn-danger){background:var(--sf-panel2)!important;color:var(--sf-text)!important;border:1px solid var(--sf-border)!important}
.btn-danger{background:rgba(255,112,138,.15)!important;color:#ff8ea4!important;border:1px solid rgba(255,112,138,.3)!important}
a{color:var(--sf-accent)!important}.nav a{font-size:14px!important;text-decoration:none!important}
.info-item,.wifi-item,.row:not(.sf-topbar .row){border-radius:14px!important}.info-item,.wifi-item{background:rgba(255,255,255,.035)!important;border:1px solid var(--sf-border)!important;padding:14px!important}
.wifi-item.sel{border-color:var(--sf-accent)!important;background:rgba(120,170,255,.15)!important}
.info-grid{gap:12px!important}.info-item{min-width:0;overflow-wrap:anywhere}

.eq-band input[type=range]::-webkit-slider-thumb{background:var(--sf-accent)!important}.eq-band input[type=range]::-moz-range-thumb{background:var(--sf-accent)!important}
.tabs .tab,.tab{border-radius:10px!important;border:1px solid var(--sf-border)!important;background:var(--sf-panel2)!important;color:var(--sf-text)!important}.tab.on{background:rgba(120,170,255,.25)!important;border-color:var(--sf-accent)!important}
.msg.info,.msg.ok,.msg.err{border:1px solid var(--sf-border);border-radius:10px!important;color:var(--sf-text)}.msg.ok{background:rgba(53,212,156,.13)!important}.msg.err{background:rgba(255,112,138,.13)!important}

body.sf-light{color-scheme:light;--sf-bg:#f3f6fc;--sf-panel:rgba(255,255,255,.86);--sf-panel2:rgba(226,233,246,.92);--sf-border:rgba(24,43,77,.13);--sf-text:#162237;--sf-muted:#64728a;--sf-accent:#176dd1;--sf-shadow:0 18px 52px rgba(28,55,94,.09)}
body.sf-light input[type=text],body.sf-light input[type=password],body.sf-light input[type=number],body.sf-light select,body.sf-light textarea{background:rgba(246,249,255,.95)!important}
body.sf-light .wifi-item,body.sf-light .info-item{background:rgba(232,240,254,.38)!important}
@media(max-width:570px){body{padding:0 12px 44px!important}.sf-topbar{padding:16px 3px 10px}.sf-tag{display:none}.header{padding:16px 2px 21px!important}.card,.status-bar,.toolbar{padding:18px!important;border-radius:20px!important}.card h2{font-size:17px!important}.info-grid{grid-template-columns:1fr 1fr!important}.eq-band{min-width:41px!important}.sf-brand{font-size:18px}}

</head><body>
<div class='toolbar'>
<a href='/'>&larr; Back</a>
<h1>System Logs</h1>
<span id='dot' class='dot'></span>
<button class='btn-sm' onclick='clear_log()'>Clear</button>
<button class='btn-sm' id='scroll-btn' onclick='toggle_scroll()'>Auto-scroll: ON</button>
</div>
<div id='log'><div id='anchor'></div></div>
<script>
var log=document.getElementById('log'),dot=document.getElementById('dot'),anchor=document.getElementById('anchor'),autoScroll=true,maxLines=2000;
function set_auto(v){autoScroll=v;document.getElementById('scroll-btn').textContent='Auto-scroll: '+(v?'ON':'OFF');}
function toggle_scroll(){set_auto(!autoScroll);if(autoScroll)log.scrollTop=log.scrollHeight;}
function at_bottom(){return log.scrollHeight-log.scrollTop-log.clientHeight<40;}
// Auto-scroll must yield to the reader: scrolling up pauses it so new lines
// never yank the view back down; scrolling to the bottom resumes it.
log.addEventListener('scroll',function(){
  if(autoScroll&&!at_bottom())set_auto(false);
  else if(!autoScroll&&at_bottom())set_auto(true);
});
function clear_log(){log.innerHTML='';anchor=document.createElement('div');anchor.id='anchor';log.appendChild(anchor);}
var ansiRe=/\x1b\[([0-9;]*)m/g;
var ansiCls={'30':1,'31':1,'32':1,'33':1,'34':1,'35':1,'36':1,'37':1,'90':1,'91':1,'92':1,'93':1,'94':1,'95':1,'96':1,'97':1};
var letterCls={'E':'a31','W':'a33','I':'a32','D':'a30','V':'a30'};
function colorize(text){
  var frag=document.createDocumentFragment();
  text.split('\n').forEach(function(line){
    if(!line)return;
    var wrap=document.createElement('span');
    var hasAnsi=ansiRe.test(line);
    ansiRe.lastIndex=0;
    if(hasAnsi){
      var last=0,cls=null,m;
      while((m=ansiRe.exec(line))!==null){
        if(m.index>last){
          var s=document.createElement('span');
          if(cls)s.className=cls;
          s.textContent=line.substring(last,m.index);
          wrap.appendChild(s);
        }
        var p=m[1].split(';');cls=null;
        for(var i=0;i<p.length;i++){if(ansiCls[p[i]])cls='a'+p[i];}
        last=ansiRe.lastIndex;
      }
      if(last<line.length){
        var s=document.createElement('span');
        if(cls)s.className=cls;
        s.textContent=line.substring(last);
        wrap.appendChild(s);
      }
    }else{
      var ch=line.charAt(0);
      if(letterCls[ch])wrap.className=letterCls[ch];
      wrap.textContent=line;
    }
    wrap.appendChild(document.createTextNode('\n'));
    frag.appendChild(wrap);
  });
  var follow=autoScroll&&at_bottom();
  log.insertBefore(frag,anchor);
  var trimmed=0;
  while(log.childNodes.length>maxLines+1){
    trimmed+=log.firstChild.offsetHeight||0;
    log.removeChild(log.firstChild);
  }
  if(follow)log.scrollTop=log.scrollHeight;
  else if(trimmed)log.scrollTop=Math.max(0,log.scrollTop-trimmed);
}
function connect(){
  var ws=new WebSocket('ws://'+location.host+'/ws/logs');
  ws.onopen=function(){dot.classList.add('ok');};
  ws.onclose=function(){dot.classList.remove('ok');setTimeout(connect,2000);};
  ws.onmessage=function(e){colorize(e.data);};
}
connect();
</script>
<script id='sf-apple-controller'>
(function(){
  "use strict";
  var root=document.body;
  if(!root || document.querySelector('.sf-topbar')) return;
  var top=document.createElement('div');top.className='sf-topbar';
  var brand=document.createElement('a');brand.className='sf-brand';brand.href='/';
  var mark=document.createElement('span');mark.className='sf-logo';mark.textContent='♫';
  var name=document.createElement('span');name.textContent='SF-AirPlay';brand.appendChild(mark);brand.appendChild(name);
  var right=document.createElement('div');right.className='sf-right';
  var tag=document.createElement('span');tag.className='sf-tag';tag.textContent='ESP32-S3  ·  Experimental';
  var toggle=document.createElement('button');toggle.type='button';toggle.className='sf-theme-btn';toggle.title='Toggle light or dark appearance';toggle.setAttribute('aria-label','Toggle appearance');
  right.appendChild(tag);right.appendChild(toggle);top.appendChild(brand);top.appendChild(right);
  root.insertBefore(top,root.firstChild);
  var footer=document.createElement('footer');footer.className='sf-footer';footer.textContent='SF-AirPlay · Local audio control · Experimental firmware';root.appendChild(footer);
  function setTheme(light){root.classList.toggle('sf-light',light);toggle.textContent=light?'☾':'☀';try{localStorage.setItem('sf-theme',light?'light':'dark')}catch(e){}}
  var saved='';try{saved=localStorage.getItem('sf-theme')||''}catch(e){}
  setTheme(saved==='light');toggle.addEventListener('click',function(){setTheme(!root.classList.contains('sf-light'))});
})();

</script>
