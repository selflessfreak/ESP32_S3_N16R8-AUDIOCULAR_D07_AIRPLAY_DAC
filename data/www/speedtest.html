<!DOCTYPE html><html><head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<title>WiFi Speedtest</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,system-ui,sans-serif;background:linear-gradient(135deg,#1a1a2e,#16213e);min-height:100vh;padding:20px;color:#fff}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:24px;margin-bottom:8px}
.sub{color:#888;font-size:13px;margin-bottom:20px}
.card{background:rgba(255,255,255,0.05);border-radius:12px;padding:18px;margin-bottom:14px;border:1px solid rgba(255,255,255,0.1)}
.card h2{font-size:15px;color:#e94560;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:13px}
.row .lbl{color:#888}
.row .val{font-weight:600;font-family:ui-monospace,monospace}
.btn{padding:10px 16px;border:none;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;background:#e94560;color:#fff;width:100%;margin-top:10px}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.btn.sec{background:rgba(255,255,255,0.1)}
select,input{width:100%;padding:10px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);border-radius:6px;color:#fff;font-size:13px;margin-bottom:8px}
.bar{height:6px;background:rgba(0,0,0,0.3);border-radius:3px;overflow:hidden;margin-top:8px}
.bar>div{height:100%;background:#e94560;width:0%;transition:width 0.1s}
.big{font-size:28px;font-weight:700;color:#e94560}
.unit{font-size:14px;color:#888;margin-left:4px}
.log{font-family:ui-monospace,monospace;font-size:11px;color:#888;max-height:140px;overflow-y:auto;padding:8px;background:rgba(0,0,0,0.3);border-radius:6px;white-space:pre-wrap}
a{color:#e94560}
</style>
<style id='sf-apple-skin'>

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0!important;min-height:100vh!important;background:radial-gradient(ellipse at 15% 0%,rgba(66,96,167,.29),transparent 48%),radial-gradient(ellipse at 90% 20%,rgba(112,68,145,.19),transparent 45%),var(--sf-bg)!important;color:var(--sf-text)!important;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif!important;font-size:15px!important;line-height:1.52!important;-webkit-font-smoothing:antialiased;padding:0 16px 66px!important}

.sf-right{display:flex;align-items:center;gap:10px}.sf-tag{font-size:11px;color:var(--sf-muted);padding:6px 10px;border:1px solid var(--sf-border);border-radius:100px;white-space:nowrap}.sf-theme-btn{border:1px solid var(--sf-border);border-radius:13px;background:var(--sf-panel2);color:var(--sf-text);font-size:17px;cursor:pointer;padding:7px 11px;min-width:40px}
.header{text-align:left!important;padding:18px 0 27px!important}.header h1{font-size:clamp(27px,5vw,40px)!important;letter-spacing:-.055em;line-height:1.14;font-weight:740!important;margin:0 0 10px!important;color:var(--sf-text)!important}.header p,.sub{color:var(--sf-muted)!important;font-size:14px!important}
.card,.status-bar,.toolbar{background:var(--sf-panel)!important;border:1px solid var(--sf-border)!important;box-shadow:var(--sf-shadow)!important;border-radius:24px!important;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding:24px!important;margin-bottom:18px!important;color:var(--sf-text)!important}
.card h2{font-size:18px!important;font-weight:680!important;letter-spacing:-.025em;color:var(--sf-text)!important;margin:0 0 20px!important}
.status-bar{color:var(--sf-text)!important}.status-bar.ok{border-color:rgba(53,212,156,.3)!important}.status-bar.err{border-color:rgba(255,112,138,.3)!important}
.form-group label,.lbl,label{color:var(--sf-muted)!important;letter-spacing:.03em;font-weight:570!important}
input[type=text],input[type=password],input[type=number],input[type=file],textarea,select{background:rgba(6,11,25,.42)!important;color:var(--sf-text)!important;border:1px solid var(--sf-border)!important;border-radius:13px!important;max-width:100%;font-family:inherit!important}
input[type=text],input[type=password],input[type=number],select,textarea{padding:11px 13px!important;min-height:44px}
input:focus,textarea:focus,select:focus{outline:2px solid rgba(120,170,255,.45)!important;outline-offset:1px}
input[type=range]{accent-color:var(--sf-accent)!important}
.btn,.btn-sm,button:not(.sf-theme-btn):not(.tab){border-radius:13px!important;font-family:inherit!important;font-weight:610!important;transition:transform .15s,background .15s,border-color .15s}
.btn:hover,.btn-sm:hover,button:hover{transform:translateY(-1px)}.btn:active,button:active{transform:translateY(0)}
.btn-primary{background:linear-gradient(135deg,#4487ef,#6564e8)!important;color:white!important;border:1px solid rgba(255,255,255,.12)!important}
.btn-secondary,.btn-sm,.btn:not(.btn-primary):not(.btn-danger){background:var(--sf-panel2)!important;color:var(--sf-text)!important;border:1px solid var(--sf-border)!important}
.btn-danger{background:rgba(255,112,138,.15)!important;color:#ff8ea4!important;border:1px solid rgba(255,112,138,.3)!important}
a{color:var(--sf-accent)!important}.nav a{font-size:14px!important;text-decoration:none!important}
.info-item,.wifi-item,.row:not(.sf-topbar .row){border-radius:14px!important}.info-item,.wifi-item{background:rgba(255,255,255,.035)!important;border:1px solid var(--sf-border)!important;padding:14px!important}
.wifi-item.sel{border-color:var(--sf-accent)!important;background:rgba(120,170,255,.15)!important}
.info-grid{gap:12px!important}.info-item{min-width:0;overflow-wrap:anywhere}
.eq-container{height:285px!important;overflow-x:auto;justify-content:flex-start!important;padding:16px 0!important;scrollbar-width:thin}.eq-band{min-width:39px!important}.eq-band .val{color:var(--sf-accent)!important}.eq-band .freq,.hint{color:var(--sf-muted)!important}
.eq-band input[type=range]::-webkit-slider-thumb{background:var(--sf-accent)!important}.eq-band input[type=range]::-moz-range-thumb{background:var(--sf-accent)!important}
.tabs .tab,.tab{border-radius:10px!important;border:1px solid var(--sf-border)!important;background:var(--sf-panel2)!important;color:var(--sf-text)!important}.tab.on{background:rgba(120,170,255,.25)!important;border-color:var(--sf-accent)!important}
.msg.info,.msg.ok,.msg.err{border:1px solid var(--sf-border);border-radius:10px!important;color:var(--sf-text)}.msg.ok{background:rgba(53,212,156,.13)!important}.msg.err{background:rgba(255,112,138,.13)!important}
.sf-footer{text-align:center;color:var(--sf-muted);font-size:12px;padding:20px 6px 10px;max-width:900px;margin:auto}
body.sf-light{color-scheme:light;--sf-bg:#f3f6fc;--sf-panel:rgba(255,255,255,.86);--sf-panel2:rgba(226,233,246,.92);--sf-border:rgba(24,43,77,.13);--sf-text:#162237;--sf-muted:#64728a;--sf-accent:#176dd1;--sf-shadow:0 18px 52px rgba(28,55,94,.09)}
body.sf-light input[type=text],body.sf-light input[type=password],body.sf-light input[type=number],body.sf-light select,body.sf-light textarea{background:rgba(246,249,255,.95)!important}
body.sf-light .wifi-item,body.sf-light .info-item{background:rgba(232,240,254,.38)!important}
@media(max-width:570px){body{padding:0 12px 44px!important}.sf-topbar{padding:16px 3px 10px}.sf-tag{display:none}.header{padding:16px 2px 21px!important}.card,.status-bar,.toolbar{padding:18px!important;border-radius:20px!important}.card h2{font-size:17px!important}.info-grid{grid-template-columns:1fr 1fr!important}.eq-band{min-width:41px!important}.sf-brand{font-size:18px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}

</style>
</head><body>
<div class='wrap'>
<h1>WiFi Speedtest</h1>
<p class='sub'>Measure latency and throughput between this browser and the device.</p>

<div class='card'>
<h2>Ping (RTT)</h2>
<div class='row'><span class='lbl'>Samples</span><span class='val' id='p-n'>0</span></div>
<div class='row'><span class='lbl'>Min</span><span class='val' id='p-min'>—</span></div>
<div class='row'><span class='lbl'>Avg</span><span class='val' id='p-avg'>—</span></div>
<div class='row'><span class='lbl'>Max</span><span class='val' id='p-max'>—</span></div>
<div class='row'><span class='lbl'>Jitter (stdev)</span><span class='val' id='p-jit'>—</span></div>
<button class='btn' id='b-ping' onclick='runPing()'>Run 20 Pings</button>
</div>

<div class='card'>
<h2>Download (device → browser)</h2>
<div style='text-align:center;padding:10px 0'><span class='big' id='dl-mbps'>0.00</span><span class='unit'>Mbit/s</span></div>
<div class='row'><span class='lbl'>Bytes</span><span class='val' id='dl-bytes'>—</span></div>
<div class='row'><span class='lbl'>Elapsed</span><span class='val' id='dl-time'>—</span></div>
<div class='bar'><div id='dl-bar'></div></div>
<label style='font-size:12px;color:#888;margin-top:10px;display:block'>Payload size</label>
<select id='dl-size'>
  <option value='262144'>256 KB</option>
  <option value='1048576' selected>1 MB</option>
  <option value='4194304'>4 MB</option>
  <option value='8388608'>8 MB</option>
</select>
<button class='btn' id='b-dl' onclick='runDownload()'>Start Download Test</button>
</div>

<div class='card'>
<h2>Upload (browser → device)</h2>
<div style='text-align:center;padding:10px 0'><span class='big' id='ul-mbps'>0.00</span><span class='unit'>Mbit/s</span></div>
<div class='row'><span class='lbl'>Bytes</span><span class='val' id='ul-bytes'>—</span></div>
<div class='row'><span class='lbl'>Elapsed</span><span class='val' id='ul-time'>—</span></div>
<div class='bar'><div id='ul-bar'></div></div>
<label style='font-size:12px;color:#888;margin-top:10px;display:block'>Payload size</label>
<select id='ul-size'>
  <option value='262144'>256 KB</option>
  <option value='1048576' selected>1 MB</option>
  <option value='4194304'>4 MB</option>
</select>
<button class='btn' id='b-ul' onclick='runUpload()'>Start Upload Test</button>
</div>

<div class='card'>
<h2>Log</h2>
<div class='log' id='log'></div>
</div>

<p style='text-align:center;margin-top:10px'><a href='/'>← Back to main</a></p>
</div>

<script>
const $ = id => document.getElementById(id);
function log(s){const l=$('log');l.textContent+=s+'\n';l.scrollTop=l.scrollHeight;}
function fmtBytes(n){if(n>=1048576)return (n/1048576).toFixed(2)+' MB';if(n>=1024)return (n/1024).toFixed(1)+' KB';return n+' B';}
function fmtMs(ms){return ms.toFixed(2)+' ms';}

async function runPing(){
  const btn=$('b-ping');btn.disabled=true;
  const N=20;const samples=[];
  $('p-n').textContent='0';
  for(let i=0;i<N;i++){
    const t0=performance.now();
    try{
      await fetch('/api/speedtest/ping?'+Math.random(),{cache:'no-store'});
      const dt=performance.now()-t0;
      samples.push(dt);
      $('p-n').textContent=samples.length;
    }catch(e){log('ping err: '+e);break;}
    await new Promise(r=>setTimeout(r,50));
  }
  if(samples.length){
    const mn=Math.min(...samples),mx=Math.max(...samples);
    const avg=samples.reduce((a,b)=>a+b,0)/samples.length;
    const v=samples.reduce((a,b)=>a+(b-avg)*(b-avg),0)/samples.length;
    const sd=Math.sqrt(v);
    $('p-min').textContent=fmtMs(mn);
    $('p-max').textContent=fmtMs(mx);
    $('p-avg').textContent=fmtMs(avg);
    $('p-jit').textContent=fmtMs(sd);
    log(`ping n=${samples.length} min=${mn.toFixed(2)} avg=${avg.toFixed(2)} max=${mx.toFixed(2)} sd=${sd.toFixed(2)} ms`);
  }
  btn.disabled=false;
}

async function runDownload(){
  const btn=$('b-dl');btn.disabled=true;
  const bytes=parseInt($('dl-size').value);
  $('dl-bytes').textContent=fmtBytes(bytes);
  $('dl-mbps').textContent='0.00';
  $('dl-bar').style.width='0%';
  const t0=performance.now();
  try{
    const resp=await fetch('/api/speedtest/download?bytes='+bytes+'&_='+Math.random(),{cache:'no-store'});
    if(!resp.ok){throw new Error('HTTP '+resp.status);}
    const reader=resp.body.getReader();
    let got=0;
    while(true){
      const {done,value}=await reader.read();
      if(done)break;
      got+=value.length;
      $('dl-bar').style.width=(100*got/bytes).toFixed(1)+'%';
      const dt=(performance.now()-t0)/1000;
      if(dt>0)$('dl-mbps').textContent=((got*8/1e6)/dt).toFixed(2);
    }
    const dt=(performance.now()-t0)/1000;
    $('dl-time').textContent=(dt*1000).toFixed(0)+' ms';
    $('dl-mbps').textContent=((got*8/1e6)/dt).toFixed(2);
    log(`download ${fmtBytes(got)} in ${(dt*1000).toFixed(0)} ms = ${((got*8/1e6)/dt).toFixed(2)} Mbit/s`);
  }catch(e){log('dl err: '+e.message);}
  btn.disabled=false;
}

async function runUpload(){
  const btn=$('b-ul');btn.disabled=true;
  const bytes=parseInt($('ul-size').value);
  $('ul-bytes').textContent=fmtBytes(bytes);
  $('ul-mbps').textContent='0.00';
  $('ul-bar').style.width='0%';
  // Pre-build payload (random data, in 64KB chunks to limit memory spike)
  const payload=new Uint8Array(bytes);
  for(let i=0;i<bytes;i+=4){payload[i]=(i*73)&0xff;}
  const t0=performance.now();
  try{
    const resp=await fetch('/api/speedtest/upload',{method:'POST',body:payload,headers:{'Content-Type':'application/octet-stream'}});
    if(!resp.ok){throw new Error('HTTP '+resp.status);}
    const dt=(performance.now()-t0)/1000;
    const txt=await resp.text();
    $('ul-bar').style.width='100%';
    $('ul-time').textContent=(dt*1000).toFixed(0)+' ms';
    $('ul-mbps').textContent=((bytes*8/1e6)/dt).toFixed(2);
    log(`upload ${fmtBytes(bytes)} in ${(dt*1000).toFixed(0)} ms = ${((bytes*8/1e6)/dt).toFixed(2)} Mbit/s (server: ${txt.trim()})`);
  }catch(e){log('ul err: '+e.message);}
  btn.disabled=false;
}
</script>

<script id='sf-apple-controller'>
(function(){
  "use strict";
  var root=document.body;
  if(!root || document.querySelector('.sf-topbar')) return;
  var top=document.createElement('div');top.className='sf-topbar';
  var brand=document.createElement('a');brand.className='sf-brand';brand.href='/';
  var mark=document.createElement('span');mark.className='sf-logo';mark.textContent='♫';
  var name=document.createElement('span');name.textContent='SF-AirPlay';brand.appendChild(mark);brand.appendChild(name);
  var right=document.createElement('div');right.className='sf-right';
  var tag=document.createElement('span');tag.className='sf-tag';tag.textContent='ESP32-S3  ·  Experimental';
  var toggle=document.createElement('button');toggle.type='button';toggle.className='sf-theme-btn';toggle.title='Toggle light or dark appearance';toggle.setAttribute('aria-label','Toggle appearance');
  right.appendChild(tag);right.appendChild(toggle);top.appendChild(brand);top.appendChild(right);
  root.insertBefore(top,root.firstChild);
  var footer=document.createElement('footer');footer.className='sf-footer';footer.textContent='SF-AirPlay · Local audio control · Experimental firmware';root.appendChild(footer);
  function setTheme(light){root.classList.toggle('sf-light',light);toggle.textContent=light?'☾':'☀';try{localStorage.setItem('sf-theme',light?'light':'dark')}catch(e){}}
  var saved='';try{saved=localStorage.getItem('sf-theme')||''}catch(e){}
  setTheme(saved==='light');toggle.addEventListener('click',function(){setTheme(!root.classList.contains('sf-light'))});
})();

</script>
</body></html>
