
; ============================================================
; ESP32-S3 N16R8 + Audiocular D07 AirPlay DAC
; Repository:
; https://github.com/selflessfreak/ESP32_S3_N16R8-AUDIOCULAR_D07_AIRPLAY_DAC
;
; Hardware:
;   Generic ESP32-S3 N16R8
;   Flash: 16 MB
;   PSRAM: 8 MB (Octal / OPI)
;   USB D-: GPIO19
;   USB D+: GPIO20
;
; Based on rbouteiller/airplay-esp32.
; Retain the original upstream LICENSE and notices.
;
; USB Audio Host firmware integration is not yet implemented.
; ============================================================

[platformio]
default_envs = esp32s3
src_dir = main
extra_configs = user_platformio.ini

; ============================================================
; COMMON SETTINGS
; ============================================================

[env]
monitor_speed = 115200
monitor_filters = direct
board_build.filesystem = spiffs

build_flags =
    -Wno-maybe-uninitialized
    -Os
    -DCONFIG_SPIRAM_SIZE=8388608

; ============================================================
; GENERIC ESP32-S3 N16R8
; Current original AirPlay / I2S build
; ============================================================

[env:esp32s3]
platform = platformio/espressif32 @ ^6.12.0
framework = espidf
board = esp32-s3-devkitc-1

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L

; 16 MB Flash
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB

; Original AirPlay partition table
board_build.partitions = components/boards/partitions.csv

; PSRAM configuration is handled by ESP-IDF sdkconfig.
; Do not rely on an Arduino-only PSRAM build setting.

board_build.cmake_extra_args =
    "-DSDKCONFIG_DEFAULTS=config/sdkconfig.defaults;config/sdkconfig.defaults.esp32s3"

monitor_speed = 115200

; ============================================================
; AUDIOCULAR D07 USB DAC - DEVELOPMENT ENVIRONMENT
;
; This environment is reserved for the upcoming USB Audio
; Host backend. For now, it inherits the original firmware
; configuration and still builds the existing audio backend.
; ============================================================

[env:esp32s3-d07]
extends = env:esp32s3
build_flags =
    ${env.build_flags}
    -DD07_USB_DAC_PROJECT=1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.cmake_extra_args =
    "-DSDKCONFIG_DEFAULTS=config/sdkconfig.defaults;config/sdkconfig.defaults.esp32s3;config/sdkconfig.defaults.d07"

[env:esp32s3-jtag]
extends = env:esp32s3
upload_protocol = esp-builtin

; ============================================================
; SQUEEZEAMP
; ============================================================

[env:squeezeamp]
platform = platformio/espressif32 @ ^6.12.0
framework = espidf
board = esp-wrover-kit
board_build.mcu = esp32
board_build.f_cpu = 240000000L
board_build.f_flash = 40000000L
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.partitions = components/boards/partitions.csv
board_upload.flash_size = 8MB
board_build.cmake_extra_args =
    "-DSDKCONFIG_DEFAULTS=config/sdkconfig.defaults;config/sdkconfig.defaults.squeezeamp"
monitor_rts = 0
monitor_dtr = 0

[env:squeezeamp-bt]
extends = env:squeezeamp
board_build.cmake_extra_args =
    "-DSDKCONFIG_DEFAULTS=config/sdkconfig.defaults;config/sdkconfig.defaults.squeezeamp;config/sdkconfig.defaults.bt"

[env:squeezeamp-4m]
extends = env:squeezeamp
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = components/boards/partitions-4m.csv
board_build.cmake_extra_args =
    "-DSDKCONFIG_DEFAULTS=config/sdkconfig.defaults;config/sdkconfig.defaults.squeezeamp-4m"

